#driver-broadcom
[Config]
Dependencies=base

[Match]
Architecture=x86-64

[Output]
ImageId=driver-broadcom
Format=sysext
Overlay=yes
Output=driver-broadcom-%a_%v
CompressOutput=false

[Validation]
Verity=yes

[Content]
Bootable=no
BaseTrees=%O/base_%v
BuildPackages=
    dkms
    broadcom-sta-dkms
    linux-headers-generic
Packages=
    kmod
    broadcom-sta-common
BuildScripts=get-module-only

