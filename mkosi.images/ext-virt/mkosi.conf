[Config]
Dependencies=base

[Output]
Format=sysext
Overlay=yes
ImageId=ext-virt
Verity=signed
CompressOutput=zstd

[Content]
Bootable=no
BaseTrees=%O/base_%v
WithRecommends=yes
RemovePackages=
    virt-manager
Packages=
    qemu-system-gui
    qemu-system-x86
    qemu-system-arm
    qemu-system-riscv
    qemu-system-modules-opengl
    qemu-system-modules-spice
    qemu-system-misc
    qemu-utils
    libvirt-daemon-system
    libvirt-clients
    libspice-server1
    libvirglrenderer1
    virgl-server
    spice-html5
    bridge-utils
    ovmf
    qemu-efi-aarch64
    virtinst
