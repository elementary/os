[Config]
Dependencies=base

[Output]
Format=sysext
Overlay=yes
ImageId=ext-virt
Verity=signed
CompressOutput=zstd

[Content]
Bootable=no
BaseTrees=%O/base_%v
WithRecommends=no
RemovePackages=
    virt-manager
Packages=
    qemu-system-x86
    qemu-system-arm
    qemu-system-riscv
    qemu-system-modules-opengl
    qemu-system-modules-spice
    qemu-system-misc
    libvirt-daemon-system
    libvirt-clients
    bridge-utils
    virtinst
