# This overrides the same file from systemd since we want to symlink everything
# into /etc instead of copying so updates to /usr propagate properly where possible.

# Core System
L+ /etc/mtab - - - - ../proc/self/mounts
L /etc/os-release - - - - ../usr/lib/os-release
C /etc/default
C /etc/systemd
C /etc/sysctl.d
C /etc/tmpfiles.d
C /etc/grub.d
C /etc/init.d
C /etc/initramfs-tools
C /etc/kernel
C /etc/modprobe.d
C /etc/modules-load.d
C /etc/modules
C /etc/crypttab
C /etc/cryptsetup-initramfs
C /etc/lsb-release
C /etc/debian_version
# Configuration for ldconfig
L /etc/ld.so.conf
L /etc/ld.so.conf.d
# Contains the default systemd locale
L /etc/locale.conf
L /etc/nsswitch.conf

# ID
C /etc/passwd
C /etc/group
C /etc/shadow
C /etc/gshadow
C /etc/subuid
C /etc/subgid
C /etc/adduser.conf
C /etc/deluser.conf

# Networking, Host & SSH
C /etc/network
C /etc/NetworkManager
C /etc/dhcp
C /etc/dhcpcd.conf
C /etc/wpa_supplicant
C /etc/ufw
C /etc/chrony
C /etc/avahi
C /etc/ppp
C /etc/openvpn
# SSH configurations
C /etc/ssh/ssh_config
C /etc/ssh/ssh_config.d
C /etc/ssh/sshd_config
C /etc/ssh/sshd_config.d
# Used by some services, like nftables
L? /etc/services
L? /etc/nftables.conf
L? /etc/dbus1/systemd.d/org.freedesktop.ModemManager1.conf

# Hardware
C /etc/udev
C /etc/udisks2
C /etc/UPower
C /etc/lvm
C /etc/bluetooth
C /etc/sane.d
C /etc/brltty
C /etc/brltty.conf
C /etc/hdparm.conf
C /etc/sensors.d
C /etc/sensors3.conf
C /etc/usb_modeswitch.conf
C /etc/thermald
L /etc/fwupd
L? /etc/cups

# Package Management & Updates
C /etc/apt
C /etc/dpkg
C /etc/PackageKit
C /etc/update-manager
C /etc/update-motd.d
L /etc/debuginfod

# Security
C /etc/apparmor
C /etc/apparmor.d
C /etc/sudoers.d
C /etc/security
C /etc/fprintd.conf
C /etc/cracklib
C /etc/sudoers
L? /etc/authselect
L? /etc/ca-certificates
L /etc/ssl
L? /etc/crypto-policies
L? /etc/pki

# Desktop Environment
C /etc/X11
C /etc/xdg
C /etc/dconf
C /etc/lightdm
C /etc/pulse
C /etc/speech-dispatcher
C /etc/console-setup
L /etc/fonts
L? /etc/geoclue

# Environment
C /etc/profile
C /etc/profile.d
C /etc/environment.d
C /etc/inputrc
C /etc/wgetrc
C /etc/screenrc
L /etc/environment
L /etc/shells
L? /etc/bashrc
L? /etc/bash.bashrc
L? /etc/bash.bash_logout
L? /etc/bash_completion
L? /etc/bash_completion.d
L? /etc/skel
C /etc/apport
C /etc/dbus-1
C /etc/mime.types
C /etc/fuse.conf
C /etc/xml
L /etc/man_db.conf
L? /etc/manpath.config
C /etc/alternatives
L? /etc/profile.d/flatpak.sh
