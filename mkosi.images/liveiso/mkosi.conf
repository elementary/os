[Config]
Dependencies=base

[Output]
Format=directory
SplitArtifacts=
ImageId=liveiso

[Content]
BaseTrees=%O/base_%v
CleanPackageMetadata=no
Bootable=yes
WithRecommends=yes
PrepareScripts=./iso-flatpaks.chroot
RemovePackages=
    systemd-boot
Packages=
    elementary-live
    io.elementary.installer-session
    grub-efi
    mokutil
    shim-signed
    e2fsprogs
    dosfstools
    casper
    initramfs-tools
Bootloader=grub
KernelInitrdModules=
    default
    /drivers/hid/
    /drivers/usb/
    /drivers/input/
    /drivers/i2c/
    /drivers/spi/
    /drivers/pinctrl/
    /drivers/mfd/intel-lpss*         # I2C/SPI controllers for laptop keyboards
    /drivers/platform/surface/
    /drivers/platform/chrome/
    /drivers/tty/serial/8250/8250_dw # Surface keyboards via SAM
    /drivers/ata/
    /drivers/nvme/
    /drivers/scsi/
    /drivers/message/fusion/
    /drivers/block/
    /drivers/mmc/
    /drivers/ufs/
    /drivers/firewire/
    /fs/isofs/
    /fs/overlayfs/
KernelCommandLine=
    rw
    console=ttyS0
    boot=casper

[Validation]
SecureBoot=no
SignExpectedPcr=no
