[Config]
Dependencies=
    base
    modules-db

[Match]
Distribution=ubuntu

[Output]
Format=disk
SplitArtifacts=partitions,uki
CompressOutput=false

[Content]
RemovePackages=
    command-not-found
VolatilePackages=
    systemd-boot-efi
Packages=
    io.elementary.apt-shim
Bootable=yes
BaseTrees=%O/base_%v
ExtraTrees=%O/modules-db_%a-%v
Output=elementary_%v
# mkosi.finalize.chroot needs the package database. /var isn't shipped in this image.
CleanPackageMetadata=no
Bootloader=systemd-boot
KernelInitrdModules=
    default
    drivers/hid/
    drivers/usb/
    drivers/input/
    drivers/i2c/
KernelCommandLine=
    splash
    quiet
    root=dissect
    mount.usr=dissect
    rw
    audit=0
    systemd.image_policy=esp=unprotected:xbootldr=unprotected+unused+absent:usr=signed:root=unprotected+encrypted+absent:home=unprotected+absent:=ignore
    systemd.image_filter=usr=elementary_*:usr-verity=elementary_*:usr-verity-sig=elementary_*:root=elementary-*:home=elementary-*
    ipe.enforce=0

[Validation]
SecureBoot=no
SignExpectedPcr=no
