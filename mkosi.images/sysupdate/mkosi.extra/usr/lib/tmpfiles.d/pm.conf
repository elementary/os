# Package Managers symlinks
# Type  Path                           Mode UID  GID  Age Target

# Sysupdate
L+      /usr/sbin/systemd-sysupdate    -    -    -    -   /usr/lib/systemd/systemd-sysupdate
L+      /usr/sbin/sysupdate            -    -    -    -   /usr/lib/systemd/systemd-sysupdate
# APT Shim
L       /etc/alternatives/apt          -    -    -    -   /usr/bin/io.elementary.apt-shim
L+      /usr/sbin/apt                  -    -    -    -   /etc/alternatives/apt
L       /etc/alternatives/apt-get      -    -    -    -   /usr/bin/io.elementary.apt-shim
L+      /usr/sbin/apt-get              -    -    -    -   /etc/alternatives/apt-get
