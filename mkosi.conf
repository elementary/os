[Config]
MinimumVersion=26~devel

[Distribution]
Distribution=ubuntu
Release=resolute
Repositories=main,universe,restricted,multiverse

[Content]
InitrdProfiles=plymouth
InitrdVolatilePackages=
    systemd
    udev
    systemd-cryptsetup
    cryptsetup-bin
    bash
    coreutils
    util-linux
    plymouth
    plymouth-theme-elementary

[Build]
ToolsTree=default
CacheDirectory=mkosi.cache
Incremental=yes
ToolsTreeDistribution=ubuntu
ToolsTreeRelease=resolute

[Output]
ImageId=elementary
OutputDirectory=mkosi.output/
Format=none
